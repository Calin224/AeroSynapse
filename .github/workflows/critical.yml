name: Critical demo regression suite
on:
  pull_request:
  # main runs the same gates in release.yml before publishing a portable release.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  critical:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: node scripts/test-critical.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-test-reports
          path: artifacts/critical/
          retention-days: 7
